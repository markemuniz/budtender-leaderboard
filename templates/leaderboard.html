<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPT Leaderboard · The Travel Agency</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04080a;
      --bg2: #070e0a;
      --card: rgba(255,255,255,0.035);
      --border: rgba(255,255,255,0.07);
      --text: #cce8d4;
      --muted: #4d7a5c;
      --accent: #2dff6e;
      --accent-dim: rgba(45,255,110,0.18);
      --gold: #ffc84a;
      --silver: #a8bec8;
      --bronze: #d4845a;
      /* supervisor accent */
      --sup-accent: #7b8fff;
      --sup-accent-dim: rgba(123,143,255,0.18);
      --sup-gold: #ffc84a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #bgCanvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }

    .smoke-wrap {
      position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden;
    }

    .smoke-puff {
      position: absolute; border-radius: 50%; filter: blur(40px);
      animation: risePuff linear infinite; opacity: 0;
    }

    @keyframes risePuff {
      0%   { transform: translateY(0) translateX(0) scale(1);   opacity: 0; }
      8%   { opacity: 1; }
      85%  { opacity: 0.4; }
      100% { transform: translateY(-110vh) translateX(var(--drift)) scale(2.6); opacity: 0; }
    }

    .particle {
      position: fixed; width: 2px; height: 2px; border-radius: 50%;
      background: var(--accent); opacity: 0; pointer-events: none; z-index: 2;
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(-80vh) translateX(var(--px)); opacity: 0; }
    }

    /* ── LAYOUT ── */
    .page {
      position: relative; z-index: 10;
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }

    /* ── GLOBAL HEADER ── */
    .global-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .brand-tag {
      display: inline-block;
      font-weight: 700; font-size: 0.7rem; letter-spacing: 0.45em;
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 0.35rem 1.2rem; border-radius: 999px;
      margin-bottom: 1.2rem; text-transform: uppercase;
    }

    .global-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      line-height: 0.9; letter-spacing: 0.04em;
      color: #fff;
      text-shadow: 0 0 40px rgba(45,255,110,0.2), 0 0 80px rgba(45,255,110,0.08);
      margin-bottom: 0.5rem;
    }

    .global-title span { color: var(--accent); }

    .global-subtitle {
      font-size: 0.8rem; letter-spacing: 0.25em;
      color: var(--muted); text-transform: uppercase;
    }

    .global-dates {
      font-size: 0.75rem; color: rgba(204,232,212,0.35);
      letter-spacing: 0.1em; margin-top: 0.3rem;
    }

    /* ── TWO COLUMNS ── */
    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: start;
    }

    /* ── COLUMN HEADER ── */
    .col-header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.2rem;
      border-bottom: 2px solid;
    }

    .col-budtenders .col-header { border-color: rgba(45,255,110,0.3); }
    .col-supervisors .col-header { border-color: rgba(123,143,255,0.3); }

    .col-label {
      font-size: 0.65rem; letter-spacing: 0.4em;
      text-transform: uppercase; margin-bottom: 0.5rem;
    }

    .col-budtenders .col-label { color: var(--muted); }
    .col-supervisors .col-label { color: rgba(123,143,255,0.6); }

    .col-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      letter-spacing: 0.05em; line-height: 1;
    }

    .col-budtenders .col-title { color: var(--accent); }
    .col-supervisors .col-title { color: var(--sup-accent); }

    .col-subtitle {
      font-size: 0.7rem; letter-spacing: 0.15em;
      text-transform: uppercase; margin-top: 0.4rem;
    }

    .col-budtenders .col-subtitle { color: var(--muted); }
    .col-supervisors .col-subtitle { color: rgba(123,143,255,0.5); }

    /* ── PODIUM ── */
    .podium-wrap {
      display: grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      gap: 0.6rem;
      align-items: end;
      margin-bottom: 2rem;
    }

    .pod-card {
      border-radius: 14px;
      padding: 1.4rem 0.9rem 1.2rem;
      text-align: center;
      border: 1px solid var(--border);
      background: var(--card);
      backdrop-filter: blur(14px);
      position: relative; overflow: hidden;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .pod-card:hover { transform: translateY(-4px); }

    /* budtender podium colours */
    .col-budtenders .pod-card.first {
      background: rgba(255,200,74,0.06);
      border-color: rgba(255,200,74,0.45);
      box-shadow: 0 0 0 1px rgba(255,200,74,0.15), 0 8px 40px rgba(255,200,74,0.2);
      animation: goldPulse 3.5s ease-in-out infinite;
    }
    .col-budtenders .pod-card.second {
      background: rgba(168,190,200,0.04);
      border-color: rgba(168,190,200,0.3);
      box-shadow: 0 4px 30px rgba(168,190,200,0.12);
    }
    .col-budtenders .pod-card.third {
      background: rgba(212,132,90,0.04);
      border-color: rgba(212,132,90,0.3);
      box-shadow: 0 4px 30px rgba(212,132,90,0.12);
    }

    /* supervisor podium colours — blue/purple tint on first */
    .col-supervisors .pod-card.first {
      background: rgba(123,143,255,0.07);
      border-color: rgba(123,143,255,0.45);
      box-shadow: 0 0 0 1px rgba(123,143,255,0.15), 0 8px 40px rgba(123,143,255,0.2);
      animation: bluePulse 3.5s ease-in-out infinite;
    }
    .col-supervisors .pod-card.second {
      background: rgba(168,190,200,0.04);
      border-color: rgba(168,190,200,0.3);
      box-shadow: 0 4px 30px rgba(168,190,200,0.12);
    }
    .col-supervisors .pod-card.third {
      background: rgba(212,132,90,0.04);
      border-color: rgba(212,132,90,0.3);
      box-shadow: 0 4px 30px rgba(212,132,90,0.12);
    }

    @keyframes goldPulse {
      0%,100% { box-shadow: 0 0 0 1px rgba(255,200,74,0.15), 0 8px 40px rgba(255,200,74,0.2); }
      50%      { box-shadow: 0 0 0 1px rgba(255,200,74,0.3),  0 8px 60px rgba(255,200,74,0.4); }
    }

    @keyframes bluePulse {
      0%,100% { box-shadow: 0 0 0 1px rgba(123,143,255,0.15), 0 8px 40px rgba(123,143,255,0.2); }
      50%      { box-shadow: 0 0 0 1px rgba(123,143,255,0.3),  0 8px 60px rgba(123,143,255,0.4); }
    }

    .pod-medal { font-size: 1.8rem; margin-bottom: 0.35rem; display: block; }

    .pod-rank-num {
      position: absolute; top: 8px; right: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.5rem; line-height: 1; opacity: 0.07; pointer-events: none;
    }

    .pod-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.25rem; letter-spacing: 0.04em;
      color: #fff; line-height: 1.1; margin-bottom: 0.3rem;
    }

    .pod-card.first .pod-name { font-size: 1.5rem; }

    .pod-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem; line-height: 1; margin-bottom: 0.15rem;
    }

    .col-budtenders .pod-card.first  .pod-score { color: var(--gold); font-size: 2.6rem; text-shadow: 0 0 16px rgba(255,200,74,0.5); }
    .col-budtenders .pod-card.second .pod-score { color: var(--silver); }
    .col-budtenders .pod-card.third  .pod-score { color: var(--bronze); }

    .col-supervisors .pod-card.first  .pod-score { color: var(--sup-accent); font-size: 2.6rem; text-shadow: 0 0 16px rgba(123,143,255,0.5); }
    .col-supervisors .pod-card.second .pod-score { color: var(--silver); }
    .col-supervisors .pod-card.third  .pod-score { color: var(--bronze); }

    .pod-label {
      font-size: 0.55rem; letter-spacing: 0.15em;
      color: var(--muted); text-transform: uppercase; margin-bottom: 0.6rem;
    }

    .pod-days { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; }

    .col-budtenders .day-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: 0.7; }
    .col-supervisors .day-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--sup-accent); opacity: 0.7; }

    .pod-days-label { font-size: 0.55rem; color: var(--muted); letter-spacing: 0.08em; margin-top: 3px; }

    /* ── DIVIDER ── */
    .section-divider {
      display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem;
    }

    .section-divider::before,
    .section-divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.07), transparent);
    }

    .section-divider span {
      font-size: 0.6rem; letter-spacing: 0.3em;
      color: var(--muted); text-transform: uppercase; white-space: nowrap;
    }

    /* ── RANKINGS LIST ── */
    .rankings-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 2rem; }

    .rank-row {
      display: flex; align-items: center; gap: 0.9rem;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 9px;
      position: relative; overflow: hidden;
      transition: all 0.2s ease;
      cursor: default;
    }

    .col-budtenders .rank-row {
      border-left: 3px solid rgba(45,255,110,0.2);
    }
    .col-budtenders .rank-row:hover {
      background: rgba(45,255,110,0.04);
      border-left-color: rgba(45,255,110,0.55);
      transform: translateX(5px);
    }

    .col-supervisors .rank-row {
      border-left: 3px solid rgba(123,143,255,0.2);
    }
    .col-supervisors .rank-row:hover {
      background: rgba(123,143,255,0.04);
      border-left-color: rgba(123,143,255,0.55);
      transform: translateX(5px);
    }

    .rank-row-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem; color: var(--muted);
      min-width: 26px; text-align: right; flex-shrink: 0;
    }

    .rank-row-bg {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 4rem; color: rgba(255,255,255,0.02);
      line-height: 1; pointer-events: none; user-select: none;
    }

    .rank-row-name {
      flex: 1; font-size: 0.9rem; font-weight: 600;
      color: #e2f0e8; letter-spacing: 0.02em;
      cursor: pointer; transition: color 0.15s;
    }

    .col-budtenders .rank-row-name:hover { color: var(--accent); }
    .col-supervisors .rank-row-name:hover { color: var(--sup-accent); }

    .rank-row-dots { display: flex; gap: 3px; align-items: center; }

    .col-budtenders .rank-row-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(45,255,110,0.35); }
    .col-supervisors .rank-row-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(123,143,255,0.35); }

    .rank-row-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem; letter-spacing: 0.03em;
      min-width: 48px; text-align: right; flex-shrink: 0;
    }

    .col-budtenders .rank-row-score { color: var(--accent); }
    .col-supervisors .rank-row-score { color: var(--sup-accent); }

    .rank-row-upt-label {
      font-size: 0.5rem; color: var(--muted);
      letter-spacing: 0.12em; text-transform: uppercase;
      min-width: 26px; flex-shrink: 0;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center; padding: 3rem 1rem; color: var(--muted);
    }
    .empty-state .big-icon { font-size: 3rem; margin-bottom: 0.8rem; }
    .empty-state h2 { font-family: 'Bebas Neue'; font-size: 1.6rem; letter-spacing: 0.05em; color: rgba(255,255,255,0.15); }
    .empty-state p { font-size: 0.8rem; margin-top: 0.4rem; }

    /* ── FOOTER ── */
    footer {
      text-align: center; padding-top: 2rem;
      border-top: 1px solid rgba(255,255,255,0.05);
      margin-top: 1rem;
    }
    footer p { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em; }

    /* ── MODAL ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.72); backdrop-filter: blur(6px);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }

    .modal {
      background: #0b150e; border: 1px solid rgba(45,255,110,0.2);
      border-radius: 18px; padding: 2rem; width: 100%; max-width: 420px;
      position: relative; transform: translateY(20px) scale(0.97);
      transition: transform 0.2s;
      box-shadow: 0 0 60px rgba(45,255,110,0.07), 0 20px 60px rgba(0,0,0,0.6);
    }
    .modal.sup-modal { border-color: rgba(123,143,255,0.25); box-shadow: 0 0 60px rgba(123,143,255,0.07), 0 20px 60px rgba(0,0,0,0.6); }
    .modal-backdrop.open .modal { transform: translateY(0) scale(1); }

    .modal-close {
      position: absolute; top: 1rem; right: 1rem;
      background: rgba(255,255,255,0.06); border: none; color: var(--muted);
      width: 30px; height: 30px; border-radius: 50%; font-size: 1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.12); color: #fff; }

    .modal-rank-badge { font-size: 0.62rem; letter-spacing: 0.25em; color: var(--muted); text-transform: uppercase; margin-bottom: 0.3rem; }
    .modal-name { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; letter-spacing: 0.05em; color: #fff; margin-bottom: 1.4rem; line-height: 1; }

    .modal-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.65rem; margin-bottom: 1.4rem; }

    .modal-stat {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; padding: 0.8rem 0.4rem; text-align: center;
    }
    .modal-stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; line-height: 1; color: var(--accent); }
    .modal-stat-val.sup { color: var(--sup-accent); }
    .modal-stat-val.gold   { color: var(--gold); }
    .modal-stat-val.silver { color: var(--silver); }
    .modal-stat-val.bronze { color: var(--bronze); }
    .modal-stat-label { font-size: 0.58rem; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; margin-top: 3px; }

    .modal-daily-title { font-size: 0.62rem; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; margin-bottom: 0.5rem; }

    .modal-daily-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.5rem 0.65rem; border-radius: 7px;
      background: rgba(255,255,255,0.025); margin-bottom: 4px; font-size: 0.82rem;
    }
    .modal-daily-date { color: rgba(204,232,212,0.6); }
    .modal-daily-nums { display: flex; gap: 1rem; }
    .modal-daily-upt  { color: var(--accent); font-family: 'Bebas Neue'; font-size: 1.05rem; letter-spacing: 0.04em; }
    .modal-daily-upt.sup { color: var(--sup-accent); }
    .modal-daily-sub  { color: var(--muted); font-size: 0.72rem; }

    /* ── RESPONSIVE ── */
    @media (max-width: 800px) {
      .columns { grid-template-columns: 1fr; gap: 3rem; }
      .podium-wrap { grid-template-columns: 1fr 1.1fr 1fr; }
    }

    @media (max-width: 500px) {
      .podium-wrap { grid-template-columns: 1fr; }
      .pod-card.first { order: -1; }
    }
  </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="smoke-wrap" id="smokeWrap"></div>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-rank-badge" id="modalRank"></div>
    <div class="modal-name" id="modalName"></div>
    <div class="modal-stats" id="modalStats"></div>
    <div class="modal-daily-title" id="modalDailyTitle"></div>
    <div id="modalDaily"></div>
  </div>
</div>

<div class="page">

  <!-- GLOBAL HEADER -->
  <div class="global-header">
    <div class="brand-tag">The Travel Agency · DTBK</div>
    <h1 class="global-title">UPT <span>Contest</span></h1>
    <p class="global-subtitle">Average Units Per Transaction</p>
    <p class="global-dates" id="dateRange">—</p>
  </div>

  <!-- TWO COLUMNS -->
  <div class="columns">

    <!-- BUDTENDERS -->
    <div class="col-budtenders" id="colBudtenders">
      <div class="col-header">
        <div class="col-label">Contest</div>
        <div class="col-title">Budtenders</div>
        <div class="col-subtitle">Avg Units / Transaction</div>
      </div>
      <div id="budtenderPodium"></div>
      <div class="section-divider" id="budtenderDivider" style="display:none"><span>Full Rankings</span></div>
      <div class="rankings-list" id="budtenderRankings"></div>
    </div>

    <!-- SUPERVISORS -->
    <div class="col-supervisors" id="colSupervisors">
      <div class="col-header">
        <div class="col-label">Contest</div>
        <div class="col-title">Supervisors</div>
        <div class="col-subtitle">Avg Units / Transaction</div>
      </div>
      <div id="supervisorPodium"></div>
      <div class="section-divider" id="supervisorDivider" style="display:none"><span>Full Rankings</span></div>
      <div class="rankings-list" id="supervisorRankings"></div>
    </div>

  </div>

  <footer>
    <p>Last updated: <span id="lastUpdated">—</span></p>
    <p style="margin-top:4px; opacity:0.5;">Manager accounts excluded · Ranked by avg units/transaction</p>
  </footer>
</div>

<script>
/* ─── BACKGROUND (icons) ─── */
const ICONS = [
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120"><path d="M50,112 L50,62 C50,62 38,72 24,67 C13,63 8,52 13,42 C20,48 33,52 48,64 C38,50 26,38 30,22 C37,28 44,44 50,62 C50,44 46,26 54,16 C58,30 56,48 50,62 C56,44 64,28 70,22 C74,38 62,50 52,64 C67,52 80,48 87,42 C92,52 87,63 76,67 C62,72 50,62 50,62 Z"/><rect x="47" y="110" width="6" height="10" rx="3"/></svg>`,
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 110"><rect x="6" y="20" width="16" height="78" rx="8"/><path d="M14,20 Q9,12 10,5 Q14,9 18,5 Q19,12 14,20"/><rect x="6" y="82" width="16" height="10" rx="3" opacity="0.5"/></svg>`,
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 96"><rect x="4" y="30" width="50" height="62" rx="7"/><rect x="20" y="18" width="18" height="16" rx="4"/><path d="M29,18 Q23,10 26,3 Q29,8 32,3 Q35,10 29,18" opacity="0.85"/></svg>`,
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 94"><circle cx="32" cy="30" r="22"/><circle cx="14" cy="15" r="11"/><circle cx="50" cy="15" r="11"/><ellipse cx="32" cy="64" rx="22" ry="24"/></svg>`,
];

(function initCanvas() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const W = canvas.width, H = canvas.height;
  const COLOR = '#0e2a14';
  const items = [];
  const count = Math.min(22, Math.floor(W * H / 42000));
  for (let i = 0; i < count; i++) {
    const svg = ICONS[Math.floor(Math.random() * ICONS.length)];
    const size = 50 + Math.random() * 90;
    const img = new Image();
    const blob = new Blob([`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" fill="${COLOR}">${svg}</svg>`], { type: 'image/svg+xml' });
    img.src = URL.createObjectURL(blob);
    items.push({ img, x: Math.random() * W, y: Math.random() * H, size, rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.003, floatAmp: 8 + Math.random() * 16, floatSpeed: 0.0004 + Math.random() * 0.0005, floatOffset: Math.random() * Math.PI * 2 });
  }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (const item of items) {
      const floatY = Math.sin(t * item.floatSpeed + item.floatOffset) * item.floatAmp;
      item.rot += item.rotSpeed;
      ctx.save();
      ctx.globalAlpha = 0.045;
      ctx.translate(item.x + item.size / 2, item.y + item.size / 2 + floatY);
      ctx.rotate(item.rot);
      ctx.drawImage(item.img, -item.size / 2, -item.size / 2, item.size, item.size);
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

/* ─── SMOKE ─── */
(function initSmoke() {
  const wrap = document.getElementById('smokeWrap');
  const colors = ['rgba(30,60,35,0.55)', 'rgba(20,45,25,0.4)', 'rgba(40,70,45,0.35)'];
  for (let i = 0; i < 8; i++) {
    const puff = document.createElement('div');
    puff.className = 'smoke-puff';
    const size = 100 + Math.random() * 180;
    const dur = 14 + Math.random() * 18;
    const drift = (Math.random() - 0.5) * 160;
    puff.style.cssText = `left:${5 + Math.random() * 90}%;bottom:${-size}px;width:${size}px;height:${size}px;background:radial-gradient(circle,${colors[i % colors.length]} 0%,transparent 70%);animation-duration:${dur}s;animation-delay:${-Math.random() * dur}s;--drift:${drift}px;`;
    wrap.appendChild(puff);
  }
})();

/* ─── PARTICLES ─── */
(function initParticles() {
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const dur = 8 + Math.random() * 12;
    p.style.cssText = `left:${Math.random() * 100}%;bottom:${Math.random() * 40}%;animation-duration:${dur}s;animation-delay:${-Math.random() * dur}s;--px:${(Math.random() - 0.5) * 60}px;width:${1 + Math.random() * 2}px;height:${1 + Math.random() * 2}px;`;
    document.body.appendChild(p);
  }
})();

const MEDALS = ['👑', '🥈', '🥉'];
const RANK_CLASS = ['first', 'second', 'third'];

let ALL_DATA = { budtenders: [], supervisors: [] };

function parseDateStr(s) {
  const [m, d, y] = s.split('/');
  return new Date(`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}T12:00:00`);
}
function formatDate(s) {
  return parseDateStr(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

/* ─── MODAL ─── */
const backdrop   = document.getElementById('modalBackdrop');
const modalEl    = document.getElementById('modal');
const modalClose = document.getElementById('modalClose');

function openModal(b, rank, isSup) {
  const scoreColor = rank === 0 ? 'gold' : rank === 1 ? 'silver' : rank === 2 ? 'bronze' : (isSup ? 'sup' : '');
  modalEl.className = isSup ? 'modal sup-modal' : 'modal';

  document.getElementById('modalRank').textContent =
    rank != null ? `#${rank + 1} · ${['1ST PLACE','2ND PLACE','3RD PLACE'][rank] || `RANK ${rank+1}`}` : '';
  document.getElementById('modalName').textContent = b.name;

  const accentClass = isSup ? 'sup' : '';
  document.getElementById('modalStats').innerHTML = `
    <div class="modal-stat">
      <div class="modal-stat-val ${scoreColor || accentClass}">${b.avg_upt.toFixed(2)}</div>
      <div class="modal-stat-label">Avg UPT</div>
    </div>
    <div class="modal-stat">
      <div class="modal-stat-val">${b.total_transactions.toLocaleString()}</div>
      <div class="modal-stat-label">Transactions</div>
    </div>
    <div class="modal-stat">
      <div class="modal-stat-val">${b.total_units.toLocaleString()}</div>
      <div class="modal-stat-label">Items Sold</div>
    </div>`;

  const daily = b.daily_upt || {};
  const dates = Object.keys(daily).sort((a, b) => parseDateStr(a) - parseDateStr(b));

  if (dates.length > 1) {
    document.getElementById('modalDailyTitle').textContent = 'Day-by-Day Breakdown';
    document.getElementById('modalDaily').innerHTML = dates.map(date => `
      <div class="modal-daily-row">
        <span class="modal-daily-date">${formatDate(date)}</span>
        <span class="modal-daily-nums">
          <span class="modal-daily-sub">${(b.daily_transactions||{})[date]||'—'} txn · ${(b.daily_units||{})[date]||'—'} items</span>
          <span class="modal-daily-upt ${isSup ? 'sup' : ''}">${daily[date].toFixed(2)}</span>
        </span>
      </div>`).join('');
  } else {
    document.getElementById('modalDailyTitle').textContent = '';
    document.getElementById('modalDaily').innerHTML = '';
  }

  backdrop.classList.add('open');
}

function closeModal() { backdrop.classList.remove('open'); }
modalClose.addEventListener('click', closeModal);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ─── RENDER HELPERS ─── */
function buildDayDots(b) {
  const days = b.days_present || 1;
  return `<div class="pod-days">${'<div class="day-dot"></div>'.repeat(days)}</div><div class="pod-days-label">${days} DAY${days !== 1 ? 'S' : ''}</div>`;
}

function renderPodium(people, podiumId, isSup) {
  const wrap = document.getElementById(podiumId);
  if (!people.length) { wrap.innerHTML = ''; return; }

  const order    = people.length >= 3 ? [people[1], people[0], people[2]] : people.length === 2 ? [people[1], people[0]] : [people[0]];
  const origRank = people.length >= 3 ? [1, 0, 2]                         : people.length === 2 ? [1, 0]                 : [0];

  const cols = order.map((b, i) => {
    const rank = origRank[i];
    const cls  = RANK_CLASS[rank];
    return `
      <div class="pod-card ${cls}" data-name="${b.name}" data-rank="${rank}" data-sup="${isSup}">
        <div class="pod-rank-num">${rank + 1}</div>
        <span class="pod-medal">${MEDALS[rank]}</span>
        <div class="pod-name">${b.name}</div>
        <div class="pod-score">${b.avg_upt.toFixed(2)}</div>
        <div class="pod-label">Avg Units / Transaction</div>
        ${buildDayDots(b)}
      </div>`;
  });

  wrap.innerHTML = `<div class="podium-wrap">${cols.join('')}</div>`;

  wrap.querySelectorAll('.pod-card').forEach(el => {
    el.addEventListener('click', () => {
      const sup   = el.dataset.sup === 'true';
      const pool  = sup ? ALL_DATA.supervisors : ALL_DATA.budtenders;
      const b     = pool.find(x => x.name === el.dataset.name);
      if (b) openModal(b, +el.dataset.rank, sup);
    });
  });
}

function renderRankings(people, listId, dividerId, startRank, isSup) {
  const list    = document.getElementById(listId);
  const divider = document.getElementById(dividerId);
  if (!people.length) { list.innerHTML = ''; divider.style.display = 'none'; return; }
  divider.style.display = 'flex';

  list.innerHTML = people.map((b, i) => {
    const rank = startRank + i;
    const days = b.days_present || 1;
    const dots = '<div class="rank-row-dot"></div>'.repeat(days);
    return `
      <div class="rank-row">
        <div class="rank-row-num">${rank}</div>
        <div class="rank-row-name" data-name="${b.name}" data-rank="${rank - 1}" data-sup="${isSup}">${b.name}</div>
        <div class="rank-row-dots">${dots}</div>
        <div class="rank-row-score">${b.avg_upt.toFixed(2)}</div>
        <div class="rank-row-upt-label">UPT</div>
        <div class="rank-row-bg">${rank}</div>
      </div>`;
  }).join('');

  list.querySelectorAll('.rank-row-name').forEach(el => {
    el.addEventListener('click', () => {
      const sup  = el.dataset.sup === 'true';
      const pool = sup ? ALL_DATA.supervisors : ALL_DATA.budtenders;
      const b    = pool.find(x => x.name === el.dataset.name);
      if (b) openModal(b, +el.dataset.rank, sup);
    });
  });
}

/* ─── MAIN LOAD ─── */
async function loadLeaderboard() {
  try {
    const res  = await fetch(`${window.location.origin}/api/leaderboard`);
    const data = await res.json();

    const MIN_TXN = 50;

    ALL_DATA.budtenders  = (data.budtenders  || []).filter(b => b.total_transactions >= MIN_TXN);
    ALL_DATA.supervisors = (data.supervisors || []);  // no min for supervisors

    const dates = (data.dates_included || []).sort((a, b) => parseDateStr(a) - parseDateStr(b));
    document.getElementById('dateRange').textContent = dates.length
      ? (dates.length === 1 ? formatDate(dates[0]) : `${formatDate(dates[0])} — ${formatDate(dates[dates.length - 1])}`)
      : '—';

    document.getElementById('lastUpdated').textContent = data.last_updated || '—';

    /* Budtenders */
    if (!ALL_DATA.budtenders.length) {
      document.getElementById('budtenderPodium').innerHTML = `<div class="empty-state"><div class="big-icon">🌿</div><h2>No Data Yet</h2><p>Upload a sales report from the admin panel.</p></div>`;
    } else {
      renderPodium(ALL_DATA.budtenders.slice(0, 3), 'budtenderPodium', false);
      renderRankings(ALL_DATA.budtenders.slice(3), 'budtenderRankings', 'budtenderDivider', 4, false);
    }

    /* Supervisors */
    if (!ALL_DATA.supervisors.length) {
      document.getElementById('supervisorPodium').innerHTML = `<div class="empty-state"><div class="big-icon">⭐</div><h2>No Data Yet</h2><p>Upload a sales report from the admin panel.</p></div>`;
    } else {
      renderPodium(ALL_DATA.supervisors.slice(0, 3), 'supervisorPodium', true);
      renderRankings(ALL_DATA.supervisors.slice(3), 'supervisorRankings', 'supervisorDivider', 4, true);
    }

  } catch (e) {
    console.error(e);
  }
}

loadLeaderboard();
setInterval(loadLeaderboard, 5 * 60 * 1000);
</script>
